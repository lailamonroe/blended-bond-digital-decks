<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#258c52" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Blended Bond" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="../../assets/app-icons/full-deck-icon.png" />
  <meta name="description" content="Saved Blended Bond prompt cards." />
  <title>Blended Bond | Saved Cards</title>
  <link rel="stylesheet" href="../../styles.css?v=brand-cleanup-41" />
  <script src="../../deck-configs.js?v=brand-cleanup-41"></script>
  <script src="../../script.js?v=brand-cleanup-41" defer></script>
</head>
<body class="theme-full-deck">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="app-shell" id="app-shell">
    <header class="site-header">
      <button class="icon-button menu-button" id="menu-button" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span><span></span>
      </button>
      <a class="header-logo" href="index.html" aria-label="Blended Bond home"><img src="../../assets/navigation/Blended_Bond_Logo-06.png" alt="Blended Bond" /></a>
      <button class="icon-button saved-shortcut" type="button" data-route="saved" aria-label="Open saved prompts"></button>
    </header>

    <div class="nav-overlay" id="nav-overlay" hidden></div>
    <nav class="site-nav" id="site-nav" aria-label="Main navigation" aria-hidden="true">
      <div class="nav-top">
        <p class="nav-logo"><img src="../../assets/navigation/Blended_Bond_Logo-06.png" alt="Blended Bond" /></p>
        <button class="icon-button close-menu" id="close-menu" type="button" aria-label="Close navigation">&times;</button>
      </div>
      <div class="nav-links">
        <button type="button" data-route="welcome">Homepage</button>
        <button type="button" data-route="deck">Explore the deck</button>
        <button type="button" data-route="how-to">How to use</button>
        <button type="button" data-route="prompts">Understanding symbols</button>
        <button type="button" data-route="saved">Saved cards <span id="nav-saved-count">(0)</span></button>
        <button type="button" data-route="next-steps">Next steps</button>
        <button type="button" data-url="../../index.html">Password page</button>
      </div>
      <div class="nav-external">
        <a href="https://www.instagram.com/theblendedbond/" target="_blank" rel="noreferrer">Instagram</a>
        <a href="https://blendedbond.com/" target="_blank" rel="noreferrer">Visit website</a>
      </div>
    </nav>

    <main id="main-content" tabindex="-1">
      <section class="page page-green saved-hub-page is-current" id="saved" aria-labelledby="saved-title">
        <div class="page-inner saved-hub-inner">
          <h2 id="saved-title">Saved prompts</h2>
          <p class="saved-intro">Come back to the prompts that felt meaningful to you. Choose a section below to revisit what you saved.</p>
          <div class="saved-category-list" id="saved-category-list" aria-label="Saved prompt categories"></div>
          <div class="saved-deck-options">
            <button class="button button-dark" type="button" data-url="deck.html?saved=1">View all saved cards</button>
            <button class="button button-soft explore-full-deck-button" type="button" data-route="deck">Explore full deck</button>
          </div>
          <button class="text-button saved-home-link" type="button" data-route="welcome">Back to homepage</button>
          <div class="saved-list" id="saved-list" hidden></div>
          <p class="empty-state" id="saved-empty" hidden>No prompts saved yet. Tap the star while exploring the deck.</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">&copy; 2026 Blended Bond | All rights reserved</footer>
  </div>
</body>
</html>
